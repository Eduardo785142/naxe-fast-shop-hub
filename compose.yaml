services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: naxe
      POSTGRES_PASSWORD: naxe_local_only
      POSTGRES_DB: naxe
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["naxe_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naxe"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["naxe_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  naxe_pg:
  naxe_redis:
